name: MSBuild experiment round

on:
  workflow_call:
    inputs:
      round:
        required: true
        type: string
      multithreaded:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '11.0.x'
      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: SDK info
        run: dotnet --info
      - name: Build Native AOT
        shell: pwsh
        run: |
          $mt = @()
          if ('${{ inputs.multithreaded }}' -eq 'true') { $mt = @('-mt') }
          dotnet publish src/DevBench.cs `
            --runtime ${{ matrix.rid }} `
            --output ./artifacts/${{ matrix.rid }} `
            -p:TargetFramework=net10.0 `
            -p:Version=0.0.1 `
            -p:InformationalVersion=0.0.1+${{ github.sha }} @mt
      - name: Rename artifact
        shell: pwsh
        run: |
          $ext = if ("${{ matrix.rid }}".StartsWith("win")) { ".exe" } else { "" }
          Move-Item "./artifacts/${{ matrix.rid }}/DevBench$ext" "./artifacts/DevBench-${{ matrix.rid }}$ext"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.round }}-DevBench-${{ matrix.rid }}
          path: ./artifacts/DevBench-${{ matrix.rid }}*
          if-no-files-found: error
