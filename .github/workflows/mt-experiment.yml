name: MSBuild multithreading experiment

on:
  push:
    branches: [damianedwards-vigilant-tribble]
    paths: ['.github/workflows/mt-experiment.yml']

permissions:
  contents: read

jobs:
  a1:
    uses: ./.github/workflows/mt-experiment-job.yml
    with:
      round: a1
      multithreaded: false
  b1:
    needs: a1
    if: always()
    uses: ./.github/workflows/mt-experiment-job.yml
    with:
      round: b1
      multithreaded: true
  b2:
    needs: b1
    if: always()
    uses: ./.github/workflows/mt-experiment-job.yml
    with:
      round: b2
      multithreaded: true
  a2:
    needs: b2
    if: always()
    uses: ./.github/workflows/mt-experiment-job.yml
    with:
      round: a2
      multithreaded: false
  a3:
    needs: a2
    if: always()
    uses: ./.github/workflows/mt-experiment-job.yml
    with:
      round: a3
      multithreaded: false
  b3:
    needs: a3
    if: always()
    uses: ./.github/workflows/mt-experiment-job.yml
    with:
      round: b3
      multithreaded: true
